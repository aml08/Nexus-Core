<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Core - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans">

    <nav class="bg-gray-800 border-b border-gray-700 p-4">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-blue-500">NEXUS CORE</h1>
            <span class="text-sm text-gray-400">Suivi Télémétrie & IA</span>
        </div>
    </nav>

    <main class="container mx-auto p-6">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <div class="bg-gray-800 border border-gray-700 rounded-lg p-6">
                <h3 class="text-gray-400 text-sm font-medium uppercase">Statut Global (IA)</h3>
                <p id="status-value" class="text-2xl font-bold text-gray-400 mt-2">Chargement...</p>
            </div>

            <div class="bg-gray-800 border border-gray-700 rounded-lg p-6">
                <h3 class="text-gray-400 text-sm font-medium uppercase">Utilisation CPU</h3>
                <p id="cpu-value" class="text-2xl font-bold text-gray-400 mt-2">-- %</p>
            </div>

            <div class="bg-gray-800 border border-gray-700 rounded-lg p-6">
                <h3 class="text-gray-400 text-sm font-medium uppercase">Température</h3>
                <p id="temp-value" class="text-2xl font-bold text-gray-400 mt-2">-- °C</p>
            </div>

        </div>
    </main>

    <script src="/static/js/dashboard.js"></script>
</body>
</html>
